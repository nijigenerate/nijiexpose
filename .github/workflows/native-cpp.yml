name: Native application packages

on:
  pull_request:
    branches: [native-cpp]
  push:
    branches: [native-cpp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile gettext catalogs
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python3 native/tools/translations.py compile
      - uses: actions/upload-artifact@v4
        with:
          name: native-translations
          path: out/i18n/*.mo
          if-no-files-found: error
  windows-native:
    needs: translations
    runs-on: windows-2022
    env:
      SCCACHE_GHA_ENABLED: "true"
      # A cold MediaPipe build can exceed the default server idle timeout.
      # Keep one statistics session for the entire application build.
      SCCACHE_IDLE_TIMEOUT: "0"
      # Also cover the upstream Halide generator's nested CMake build.
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify D reference sources
        shell: pwsh
        run: ./native/tools/verify-reference.ps1
      - name: Verify vendored dependencies and license notices
        run: python native/tools/verify-vendor.py
      - name: Enable MSVC command line
        uses: ilammy/msvc-dev-cmd@v1
      - name: Enable C and C++ compilation cache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - uses: actions/download-artifact@v4
        with:
          name: native-translations
          path: out/i18n
      - uses: dlang-community/setup-dlang@v1.4.0
        with:
          compiler: ldc-1.41.0
      - name: Cache pinned Boost headers
        id: boost-cache
        uses: actions/cache@v4
        with:
          path: build/boost
          key: native-boost-${{ runner.os }}-${{ hashFiles('cmake/dependencies.lock.json', 'cmake/FetchBoostHeaders.cmake') }}
      - name: Fetch pinned Boost headers
        if: steps.boost-cache.outputs.cache-hit != 'true'
        run: cmake -DBOOST_DESTINATION="${{ github.workspace }}/build/boost" -P cmake/FetchBoostHeaders.cmake
      - name: Fetch verified tracker test portrait
        run: cmake -DDESTINATION="${{ github.workspace }}/out/tracker-test/portrait.jpg" -P native/tools/fetch-tracker-test-image.cmake
      - name: Identify tracker build environment
        id: tracker-environment
        shell: pwsh
        run: |
          $identity = "$env:ImageVersion|$env:VCToolsVersion|$env:WindowsSDKVersion"
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identity)))
          "id=$hash" >> $env:GITHUB_OUTPUT
      - name: Cache nijitrack source compilation
        id: tracker-cache
        uses: actions/cache/restore@v4
        with:
          path: build/native-release/tracker-cache
          key: nijitrack-bazel-${{ runner.os }}-${{ runner.arch }}-${{ steps.tracker-environment.outputs.id }}-${{ hashFiles('native/tracker/NijitrackSource.cmake', 'native/tracker/WindowsSource.cmake', 'native/tracker/patches/enable-windows-cache.ps1') }}-${{ github.sha }}
          restore-keys: |
            nijitrack-bazel-${{ runner.os }}-${{ runner.arch }}-${{ steps.tracker-environment.outputs.id }}-${{ hashFiles('native/tracker/NijitrackSource.cmake', 'native/tracker/WindowsSource.cmake', 'native/tracker/patches/enable-windows-cache.ps1') }}-
            nijitrack-bazel-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure Windows application
        shell: pwsh
        run: |
          $boostRoot = Get-Content build/boost/prefix.txt -Raw
          cmake --preset native-release -DBOOST_ROOT="$boostRoot" -DBoost_NO_SYSTEM_PATHS=ON -DBoost_NO_BOOST_CMAKE=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DNIJIEXPOSE_TRACKER_TEST_IMAGE="${{ github.workspace }}/out/tracker-test/portrait.jpg" -DNIJIEXPOSE_TRACKER_SOURCE_DIR="${{ github.workspace }}/build/nt"
      - name: Build
        shell: pwsh
        run: |
          sccache --zero-stats
          $timer = [Diagnostics.Stopwatch]::StartNew()
          cmake --build --preset native-release --parallel 3 2>&1 | Tee-Object -FilePath build/native-release/build.log
          $buildExit = $LASTEXITCODE
          $timer.Stop()
          "Build seconds: $([math]::Round($timer.Elapsed.TotalSeconds, 2))" | Tee-Object -FilePath build/native-release/build-time.txt
          exit $buildExit
      - name: Report compilation cache statistics
        if: always() && steps.sccache.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/native-release | Out-Null
          sccache --show-stats | Tee-Object -FilePath build/native-release/sccache-stats.txt
          '### Native compilation cache' >> $env:GITHUB_STEP_SUMMARY
          '```text' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path build/native-release/build-time.txt) {
            Get-Content build/native-release/build-time.txt >> $env:GITHUB_STEP_SUMMARY
          }
          Get-Content build/native-release/sccache-stats.txt >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          '### Tracker Bazel compilation cache' >> $env:GITHUB_STEP_SUMMARY
          'Restore matched key: ${{ steps.tracker-cache.outputs.cache-matched-key }}' >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path build/native-release/build.log) {
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Select-String -Path build/native-release/build.log -Pattern 'INFO: .*processes:|INFO: Elapsed time:|disk cache hit' |
              ForEach-Object { $_.Line } >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Save nijitrack compiler outputs
        if: always() && steps.tracker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/native-release/tracker-cache
          key: ${{ steps.tracker-cache.outputs.cache-primary-key }}
      - name: Verify restored tracker cache was used
        if: success() && steps.tracker-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $log = Get-Content build/native-release/build.log -Raw
          if ($log -notmatch '[1-9][0-9]* disk cache hit') {
            throw 'An exact tracker cache was restored, but Bazel reported no cached compiler results.'
          }
      - name: Test D comparisons, Boost.JSON settings, gettext and ImGui
        run: ctest --preset native-release --output-junit "${{ github.workspace }}/build/native-release/test-results.xml"
      - name: Upload test results and available GPU captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nijiexpose-native-windows-test-results
          path: |
            build/native-release/test-results.xml
            build/native-release/build-time.txt
            build/native-release/build.log
            build/native-release/sccache-stats.txt
            build/native-release/visual-results/*.png
            build/native-release/application-results/*.png
            build/native-release/application-results/results.json
            build/native-release/tracker-results/*
            build/native-release/application-results/*.png
            build/native-release/application-results/results.json
          if-no-files-found: warn
      - name: Locate binary WiX tools
        shell: pwsh
        run: ./build-aux/windows/ensure-wix.ps1
      - name: Package ZIP and MSI
        run: cpack --config build/native-release/CPackConfig.cmake -C Release
      - name: Verify unpacked Windows package
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/native-release/packages/*.zip
          if ($zip.Count -ne 1) { throw 'Expected one Windows ZIP' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath out/package-check
          python native/tools/verify-package.py "out/package-check/$($zip.BaseName)"
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: nijiexpose-native-windows-packages
          path: |
            build/native-release/packages/*.zip
            build/native-release/packages/*.msi
          if-no-files-found: error
  unix-native:
    needs: translations
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux binary dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lld jq pkg-config libboost-json-dev \
            libfreetype-dev gettext liblua5.1-0-dev libgl-dev libegl-dev libx11-dev \
            libxi-dev libxtst-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxinerama-dev libwayland-dev wayland-protocols libxkbcommon-dev libasound2-dev \
            libpulse-dev libudev-dev libxss-dev libxext-dev libxrender-dev libdrm-dev libgbm-dev \
            libgles2-mesa-dev libdbus-1-dev libibus-1.0-dev libdecor-0-dev libpipewire-0.3-dev
      - name: Install macOS binary dependencies
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install --force-bottle ninja boost sdl3 freetype gettext jq pkg-config
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix gettext)" >> "$GITHUB_ENV"
      - name: Identify compiler and SDK
        id: environment
        shell: bash
        run: |
          {
            echo "$ImageVersion"
            clang --version
            if [[ "$RUNNER_OS" == macOS ]]; then xcrun --sdk macosx --show-sdk-version; fi
          } > /tmp/nijiexpose-toolchain.txt
          echo "id=$(shasum -a 256 /tmp/nijiexpose-toolchain.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore MediaPipe compiler cache
        uses: actions/cache@v4
        with:
          path: build/native-release/tracker-cache
          key: nijitrack-unix-${{ runner.os }}-${{ runner.arch }}-${{ steps.environment.outputs.id }}-${{ hashFiles('native/tracker/*Source.cmake', 'native/tracker/patches/*') }}-${{ github.sha }}
          restore-keys: |
            nijitrack-unix-${{ runner.os }}-${{ runner.arch }}-${{ steps.environment.outputs.id }}-${{ hashFiles('native/tracker/*Source.cmake', 'native/tracker/patches/*') }}-
      - name: Configure
        run: cmake --preset native-release -DBUILD_TESTING=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build --preset native-release --parallel 3
      - name: Package
        run: cpack --config build/native-release/CPackConfig.cmake -C Release
      - name: Verify unpacked package
        shell: bash
        run: |
          mkdir -p out/package-check
          for archive in build/native-release/packages/*.zip; do
            unzip -q "$archive" -d out/package-check
            python3 native/tools/verify-package.py "out/package-check/$(basename "$archive" .zip)"
          done
      - name: Compilation cache statistics
        if: always()
        run: sccache --show-stats
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nijiexpose-native-${{ runner.os }}-${{ runner.arch }}-packages
          path: |
            build/native-release/packages/*.zip
            build/native-release/packages/*.dmg
            build/native-release/packages/*.tar.gz
          if-no-files-found: error
